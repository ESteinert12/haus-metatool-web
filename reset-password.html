<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAUS — Reset Password</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f0;--text:#1a1a18;--text2:#6b6b67;--text3:#9e9d99;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.13);
  --accent:#1a1a18;--radius:14px;--radius-sm:8px;
  --red:#d63030;--red-bg:#fdeaea;--red-text:#a82020;
  --green:#1a8a4a;--green-bg:#eaf6ef;--green-text:#156638;
}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border:0.5px solid var(--border);border-radius:var(--radius);padding:32px;width:360px;box-shadow:0 2px 16px rgba(0,0,0,0.07)}
.logo{font-size:22px;font-weight:700;letter-spacing:0.04em;margin-bottom:6px}
.sub{font-size:13px;color:var(--text3);margin-bottom:22px;line-height:1.5}
.form-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:5px;display:block}
.form-input{padding:10px 12px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;color:var(--text);background:var(--bg);font-family:inherit;outline:none;width:100%;margin-bottom:14px}
.form-input:focus{border-color:var(--accent)}
.btn{width:100%;padding:11px;border-radius:var(--radius-sm);border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:0.6;cursor:default}
#msg{display:none;padding:9px 12px;border-radius:var(--radius-sm);font-size:12px;margin-bottom:14px}
#msg.err{background:var(--red-bg);color:var(--red-text);display:block}
#msg.ok{background:var(--green-bg);color:var(--green-text);display:block}
</style>
</head>
<body>

<div class="card">
  <div class="logo">HAUS</div>
  <div class="sub" id="sub">Set a new password.</div>
  <div id="msg"></div>
  <div id="form-wrap">
    <label class="form-label">New password (12+ characters)</label>
    <input id="pw1" type="password" class="form-input" autocomplete="new-password">
    <label class="form-label">Confirm</label>
    <input id="pw2" type="password" class="form-input" autocomplete="new-password">
    <button id="submit-btn" class="btn" onclick="submitReset()">Set password</button>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search)
const scope = params.get('scope')
const id = params.get('id')
const token = params.get('token')
const PORTAL_NAMES = { portal: 'client-portal.html', writer: 'producer.html' }

function showMsg(text, kind) {
  const el = document.getElementById('msg')
  el.textContent = text
  el.className = kind
}

if (!['portal', 'writer'].includes(scope) || !id || !token) {
  document.getElementById('form-wrap').style.display = 'none'
  showMsg('This reset link is incomplete or invalid. Ask HAUS for a new one.', 'err')
} else {
  document.getElementById('sub').textContent = scope === 'portal'
    ? 'Set a new password for your HAUS client-portal login.'
    : 'Set a new password for your HAUS composer-portal login.'
}

async function submitReset() {
  const btn = document.getElementById('submit-btn')
  const pw1 = document.getElementById('pw1').value
  const pw2 = document.getElementById('pw2').value
  if (pw1.length < 12) { showMsg('Password must be at least 12 characters.', 'err'); return }
  if (pw1 !== pw2) { showMsg('Passwords do not match.', 'err'); return }
  btn.disabled = true; btn.textContent = 'Setting password…'
  try {
    const r = await fetch('/api/password-reset/complete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ scope, id, token, newPassword: pw1 })
    }).then(r => r.json())
    if (!r.ok) {
      showMsg(r.error || 'Could not set password.', 'err')
      btn.disabled = false; btn.textContent = 'Set password'
      return
    }
    document.getElementById('form-wrap').style.display = 'none'
    showMsg(`Password set. You can sign in now at ${PORTAL_NAMES[scope]}.`, 'ok')
  } catch (e) {
    showMsg('Something went wrong. Try again.', 'err')
    btn.disabled = false; btn.textContent = 'Set password'
  }
}
</script>
</body>
</html>
