<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAUS — Producer Portal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f0;--bg2:#eceae4;--bg3:#fff;
  --text:#1a1a18;--text2:#6b6b67;--text3:#9e9d99;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.13);
  --accent:#1a1a18;--radius:10px;--radius-sm:6px;
  --blue:#1a6cf6;--blue-bg:#eef4fe;--blue-text:#1251c2;
  --green:#1a8a4a;--green-bg:#eaf6ef;--green-text:#156638;
  --amber:#b87500;--amber-bg:#fdf3e0;--amber-text:#8a5800;
  --red:#d63030;--red-bg:#fdeaea;--red-text:#a82020;
  --purple:#7c3aed;--purple-bg:#f3f0ff;--purple-text:#5b21b6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;padding-top:38px}
#drag{position:fixed;top:0;left:0;right:0;height:38px;-webkit-app-region:drag;background:var(--bg2);border-bottom:0.5px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:10px;z-index:200}
#drag-title{font-size:12px;font-weight:500;color:var(--text2)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;font-size:12px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);background:var(--bg3);color:var(--text2);cursor:pointer;transition:background 0.1s;font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--bg2)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{opacity:0.88}
.btn.danger{background:var(--red-bg);color:var(--red-text);border-color:transparent}
.btn i{font-size:14px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;flex-shrink:0}
.pill.blue{background:var(--blue-bg);color:var(--blue-text)}
.pill.green{background:var(--green-bg);color:var(--green-text)}
.pill.amber{background:var(--amber-bg);color:var(--amber-text)}
.pill.red{background:var(--red-bg);color:var(--red-text)}
.pill.gray{background:var(--bg2);color:var(--text2)}
.pill.purple{background:var(--purple-bg);color:var(--purple-text)}
.form-input{padding:7px 10px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;color:var(--text);background:var(--bg);font-family:inherit;outline:none;width:100%}
.form-input:focus{border-color:var(--accent)}
select.form-input{cursor:pointer}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── Login ── */
#login-screen{flex:1;display:flex;align-items:center;justify-content:center}
.login-card{background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius);padding:32px;width:360px;box-shadow:0 2px 16px rgba(0,0,0,0.07)}
.login-logo{font-size:22px;font-weight:700;letter-spacing:0.04em;margin-bottom:6px}
.login-sub{font-size:13px;color:var(--text3);margin-bottom:24px}
.form-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:5px;display:block}

/* ── App shell ── */
#app-shell{flex:1;display:none;flex-direction:column;overflow:hidden}
#app-shell.visible{display:flex}

/* ── Top nav ── */
.topbar{display:flex;align-items:center;gap:0;padding:0 20px;height:48px;border-bottom:0.5px solid var(--border);background:var(--bg3);flex-shrink:0}
.topbar-brand{font-size:14px;font-weight:700;letter-spacing:0.04em;margin-right:20px}
.nav-tabs{display:flex;gap:2px;flex:1}
.nav-tab{display:flex;align-items:center;gap:6px;padding:6px 14px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--text);border-bottom-color:var(--accent)}
.nav-tab i{font-size:15px}
.topbar-right{display:flex;align-items:center;gap:8px}
.user-chip{font-size:12px;color:var(--text3);display:flex;align-items:center;gap:6px}
.avatar-sm{width:24px;height:24px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex-shrink:0}

/* ── Sections ── */
.section{flex:1;overflow:hidden;display:none;flex-direction:column}
.section.active{display:flex}

/* ── Stat bar ── */
.stat-bar{display:flex;gap:12px;padding:10px 20px;border-bottom:0.5px solid var(--border);background:var(--bg);flex-shrink:0}
.stat-item{text-align:center}
.stat-num{font-size:17px;font-weight:600;color:var(--text)}
.stat-lbl{font-size:10px;color:var(--text3);margin-top:1px}

/* ── Two-pane layout ── */
.two-pane{flex:1;display:grid;overflow:hidden}
.two-pane.split{grid-template-columns:1fr 360px}
.left-pane{display:flex;flex-direction:column;overflow:hidden;border-right:0.5px solid var(--border)}
.right-pane{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.pane-header{padding:12px 16px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0;background:var(--bg3)}
.pane-scroll{flex:1;overflow-y:auto}
.filter-tabs{display:flex;gap:3px;background:var(--bg2);border-radius:var(--radius-sm);padding:3px}
.filter-tab{background:none;border:none;padding:4px 10px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;font-family:inherit}
.filter-tab.active{background:var(--bg3);color:var(--text);box-shadow:0 0.5px 2px rgba(0,0,0,0.08)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;color:var(--text3);text-align:center;padding:40px}
.empty-state i{font-size:28px}
.empty-state p{font-size:13px}

/* ── Assignments ── */
.assign-item{padding:12px 16px;border-bottom:0.5px solid var(--border);cursor:pointer}
.assign-item:hover{background:var(--bg2)}
.assign-item.selected{background:var(--blue-bg)}
.assign-item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px}
.assign-item-title{font-size:13px;font-weight:500;color:var(--text);line-height:1.4}
.assign-item-meta{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:6px}
.due-soon{color:var(--amber-text);font-weight:600}
.overdue{color:var(--red-text);font-weight:600}
.priority-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:4px}
.priority-dot.Urgent{background:var(--red)}
.priority-dot.High{background:var(--amber)}
.priority-dot.Normal{background:var(--green)}
.detail-scroll{flex:1;overflow-y:auto;padding:18px}
.detail-block{background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.section-lbl{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px}
.file-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg2);border-radius:var(--radius-sm);margin-top:6px;font-size:12px;color:var(--text2)}
.file-row i{font-size:14px;color:var(--text3);flex-shrink:0}
.deliv-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--green-bg);border-radius:var(--radius-sm);margin-top:6px;font-size:12px;color:var(--green-text)}
.upload-zone{border:1.5px dashed var(--border2);border-radius:var(--radius-sm);padding:20px;text-align:center;cursor:pointer;margin-top:6px;transition:all 0.15s}
.upload-zone:hover,.upload-zone.drag-over{border-color:var(--blue);background:var(--blue-bg)}
.upload-zone i{font-size:22px;color:var(--text3);margin-bottom:5px}
.upload-zone p{font-size:12px;color:var(--text3)}
.action-bar{padding:12px 16px;border-top:0.5px solid var(--border);background:var(--bg3);display:flex;align-items:center;gap:8px;flex-shrink:0}

/* ── Playlists ── */
.playlist-list-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:0.5px solid var(--border);cursor:pointer}
.playlist-list-item:hover{background:var(--bg2)}
.playlist-list-item.selected{background:var(--blue-bg)}
.playlist-thumb{width:40px;height:40px;border-radius:var(--radius-sm);background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.playlist-info{flex:1;min-width:0}
.playlist-name{font-size:13px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.playlist-meta{font-size:11px;color:var(--text3);margin-top:2px}
.track-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:0.5px solid var(--border)}
.track-row:last-child{border-bottom:none}
.track-num{font-size:11px;color:var(--text3);width:18px;text-align:right;flex-shrink:0}
.track-row-info{flex:1;min-width:0}
.track-row-title{font-size:13px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track-row-meta{font-size:11px;color:var(--text3);margin-top:1px}
.track-row-actions{display:flex;gap:4px;opacity:0;transition:opacity 0.1s}
.track-row:hover .track-row-actions{opacity:1}
.ext-badge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;background:var(--purple-bg);color:var(--purple-text)}

/* Add track modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:300;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--bg3);border-radius:var(--radius);padding:22px;width:500px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,0.18)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-title{font-size:15px;font-weight:600}
.modal-body{flex:1;overflow-y:auto}
.track-pick-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer}
.track-pick-row:hover{background:var(--bg2)}
.track-pick-row input[type=checkbox]{cursor:pointer;width:14px;height:14px}

/* ── Ideas ── */
.ideas-layout{flex:1;display:grid;grid-template-columns:1fr 320px;overflow:hidden}
.feed{display:flex;flex-direction:column;overflow:hidden;border-right:0.5px solid var(--border)}
.feed-header{padding:12px 16px;border-bottom:0.5px solid var(--border);background:var(--bg3);flex-shrink:0;display:flex;align-items:center;gap:8px}
.feed-items{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.idea-card{background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius);padding:14px}
.idea-card:hover{border-color:var(--border2)}
.idea-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.idea-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.idea-author{font-size:12px;font-weight:600;color:var(--text)}
.idea-time{font-size:11px;color:var(--text3)}
.idea-body{font-size:13px;color:var(--text);line-height:1.6;margin-bottom:10px}
.idea-ref{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg2);border-radius:var(--radius-sm);font-size:12px;color:var(--text2);margin-bottom:10px;cursor:pointer}
.idea-ref:hover{background:var(--bg)}
.idea-ref i{font-size:14px;color:var(--text3);flex-shrink:0}
.idea-actions{display:flex;align-items:center;gap:12px}
.idea-action-btn{background:none;border:none;font-size:11px;color:var(--text3);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px;padding:3px 0}
.idea-action-btn:hover{color:var(--text)}
.idea-action-btn.liked{color:var(--red);font-weight:600}
.idea-action-btn i{font-size:13px}
.compose-box{background:var(--bg3);border-top:0.5px solid var(--border);padding:12px 16px;flex-shrink:0}
.compose-inner{display:flex;gap:8px;align-items:flex-end}
.compose-textarea{flex:1;padding:8px 10px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;color:var(--text);background:var(--bg);font-family:inherit;outline:none;resize:none;min-height:38px;max-height:120px}
.compose-textarea:focus{border-color:var(--accent)}
.compose-opts{display:flex;gap:6px;margin-top:8px;align-items:center}
.comments-pane{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.comments-header{padding:12px 16px;border-bottom:0.5px solid var(--border);background:var(--bg3);font-size:13px;font-weight:600;flex-shrink:0}
.comments-scroll{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.comment-row{display:flex;gap:8px}
.comment-bubble{background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;flex:1}
.comment-meta{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.comment-author{font-size:11px;font-weight:600;color:var(--text)}
.comment-time{font-size:10px;color:var(--text3)}
.comment-body{font-size:12px;color:var(--text);line-height:1.5}
.comment-compose{padding:12px 14px;border-top:0.5px solid var(--border);background:var(--bg3);display:flex;gap:6px;flex-shrink:0}
.placeholder-pane{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;color:var(--text3);padding:30px;text-align:center}
.placeholder-pane i{font-size:24px}
.placeholder-pane p{font-size:12px}

@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="drag"><span id="drag-title">HAUS Composer Portal</span></div>

<!-- ── LOGIN ── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">HAUS</div>
    <div class="login-sub">Composer Portal</div>
    <div id="login-error" style="display:none;font-size:12px;color:var(--red-text);background:var(--red-bg);border-radius:var(--radius-sm);padding:8px 10px;margin-bottom:12px"></div>
    <label class="form-label">Email</label>
    <input class="form-input" id="login-email" type="email" autocomplete="username" style="margin-bottom:12px">
    <label class="form-label">Password</label>
    <input class="form-input" id="login-password" type="password" autocomplete="current-password" style="margin-bottom:16px" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn primary" style="width:100%" id="login-btn" onclick="doLogin()"><i class="ti ti-arrow-right"></i> Log in</button>
  </div>
</div>

<!-- ── CHANGE PASSWORD (forced on first login) ── -->
<div id="change-pw-screen" style="display:none">
  <div class="login-card">
    <div class="login-logo">HAUS</div>
    <div class="login-sub">Set a new password to continue</div>
    <div id="change-pw-error" style="display:none;font-size:12px;color:var(--red-text);background:var(--red-bg);border-radius:var(--radius-sm);padding:8px 10px;margin-bottom:12px"></div>
    <label class="form-label">Current password</label>
    <input class="form-input" id="change-pw-old" type="password" style="margin-bottom:12px">
    <label class="form-label">New password (12+ characters)</label>
    <input class="form-input" id="change-pw-new" type="password" style="margin-bottom:16px">
    <button class="btn primary" style="width:100%" onclick="doChangePassword()"><i class="ti ti-check"></i> Set password &amp; continue</button>
  </div>
</div>

<!-- ── APP ── -->
<div id="app-shell">
  <div class="topbar">
    <span class="topbar-brand">HAUS</span>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchTab('assignments',this)"><i class="ti ti-checklist"></i> Assignments</button>
      <button class="nav-tab" onclick="switchTab('titles',this)"><i class="ti ti-music"></i> My Titles</button>
    </div>
    <div class="topbar-right">
      <div style="position:relative">
        <button class="btn" onclick="toggleNotifications()"><i class="ti ti-bell"></i><span id="notif-badge" class="nav-badge" style="display:none"></span></button>
        <div id="notif-dropdown" style="display:none;position:absolute;right:0;top:calc(100% + 6px);width:320px;max-height:380px;overflow-y:auto;background:var(--bg3);border:0.5px solid var(--border2);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,0.12);z-index:50"></div>
      </div>
      <div class="user-chip">
        <div class="avatar-sm" id="portal-avatar"></div>
        <span id="portal-user-label"></span>
      </div>
      <button class="btn" onclick="doLogout()"><i class="ti ti-logout"></i></button>
    </div>
  </div>

  <!-- ── ASSIGNMENTS ── -->
  <div class="section active" id="tab-assignments">
    <div class="stat-bar" id="stat-bar"></div>
    <div class="two-pane split">
      <div class="left-pane">
        <div class="pane-header">
          <div class="filter-tabs">
            <button class="filter-tab active" onclick="setAssignFilter('all',this)">All</button>
            <button class="filter-tab" onclick="setAssignFilter('Pending',this)">Pending</button>
            <button class="filter-tab" onclick="setAssignFilter('In Progress',this)">In Progress</button>
            <button class="filter-tab" onclick="setAssignFilter('Needs Review',this)">Needs Review</button>
            <button class="filter-tab" onclick="setAssignFilter('Delivered',this)">Delivered</button>
          </div>
        </div>
        <div class="pane-scroll" id="assign-list"></div>
      </div>
      <div class="right-pane">
        <div class="detail-scroll" id="assign-detail">
          <div class="empty-state"><i class="ti ti-checklist"></i><p>Select an assignment</p></div>
        </div>
        <div class="action-bar" id="assign-action-bar" style="display:none"></div>
      </div>
    </div>
  </div>

  <!-- ── MY TITLES ── -->
  <div class="section" id="tab-titles">
    <div class="pane-scroll" id="titles-list" style="padding:16px;overflow-y:auto;height:100%"></div>
  </div>

</div>

<script>
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December']

// ── State ─────────────────────────────────────────────────────
let currentUser = null
let assignments = []
let titles = []
let notifications = []
let assignFilter = 'all'
let selectedAssignId = null

// ── Fetch helpers ─────────────────────────────────────────────
async function _get(path) {
  const r = await fetch(path, { credentials: 'include' })
  return r.json()
}
async function _post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}), credentials: 'include' })
  return r.json()
}

// ── Auth ──────────────────────────────────────────────────────
async function checkSession() {
  const data = await _get('/api/writer-portal/auth/me')
  if (data.user) {
    currentUser = data.user
    if (currentUser.must_change_password) { showChangePassword() } else { enterApp() }
  } else {
    showLogin()
  }
}

function showLogin() {
  document.getElementById('login-screen').style.display = 'flex'
  document.getElementById('change-pw-screen').style.display = 'none'
  document.getElementById('app-shell').classList.remove('visible')
}
function showChangePassword() {
  document.getElementById('login-screen').style.display = 'none'
  document.getElementById('change-pw-screen').style.display = 'flex'
  document.getElementById('app-shell').classList.remove('visible')
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim()
  const password = document.getElementById('login-password').value
  const errEl = document.getElementById('login-error')
  errEl.style.display = 'none'
  if (!email || !password) { errEl.textContent = 'Email and password are required.'; errEl.style.display = 'block'; return }
  const btn = document.getElementById('login-btn')
  btn.disabled = true
  const data = await _post('/api/writer-portal/auth/login', { email, password })
  btn.disabled = false
  if (!data.ok) { errEl.textContent = data.error || 'Login failed.'; errEl.style.display = 'block'; return }
  currentUser = data.user
  document.getElementById('login-password').value = ''
  if (currentUser.must_change_password) { showChangePassword() } else { enterApp() }
}

async function doChangePassword() {
  const oldPassword = document.getElementById('change-pw-old').value
  const newPassword = document.getElementById('change-pw-new').value
  const errEl = document.getElementById('change-pw-error')
  errEl.style.display = 'none'
  const data = await _post('/api/writer-portal/auth/change-password', { oldPassword, newPassword })
  if (!data.ok) { errEl.textContent = data.error || 'Could not change password.'; errEl.style.display = 'block'; return }
  document.getElementById('change-pw-old').value = ''
  document.getElementById('change-pw-new').value = ''
  enterApp()
}

async function doLogout() {
  await _post('/api/writer-portal/auth/logout')
  currentUser = null; assignments = []; titles = []; notifications = []
  showLogin()
}

function enterApp() {
  document.getElementById('login-screen').style.display = 'none'
  document.getElementById('change-pw-screen').style.display = 'none'
  document.getElementById('app-shell').classList.add('visible')
  const name = currentUser.display_name || currentUser.composer_name || currentUser.email
  const initials = name.split(/[\s.]+/).filter(Boolean).map(w => w[0]).join('').toUpperCase().slice(0, 2)
  document.getElementById('portal-avatar').textContent = initials
  document.getElementById('portal-avatar').style.background = 'var(--accent)'
  document.getElementById('portal-user-label').textContent = `${name} (${currentUser.composer_id})`
  document.getElementById('drag-title').textContent = `HAUS Composer Portal — ${name}`
  loadAssignments()
  loadTitles()
  loadNotifications()
}

// ── Tab nav ───────────────────────────────────────────────────
function switchTab(id, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'))
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'))
  document.getElementById('tab-' + id).classList.add('active')
  btn.classList.add('active')
}

// ── Assignments (real data from /api/writer-portal/my-assignments) ──────
async function loadAssignments() {
  const data = await _get('/api/writer-portal/my-assignments')
  if (!data.ok) { document.getElementById('assign-list').innerHTML = `<div class="empty-state"><i class="ti ti-alert-circle"></i><p>${escapeHtml(data.error || 'Could not load assignments')}</p></div>`; return }
  assignments = data.assignments
  renderStats(); renderAssignList()
}

function renderStats() {
  const c = { Pending: 0, 'In Progress': 0, 'Needs Review': 0, Delivered: 0 }
  assignments.forEach(a => { if (c[a.status] !== undefined) c[a.status]++ })
  document.getElementById('stat-bar').innerHTML = `
    <div class="stat-item"><div class="stat-num">${assignments.length}</div><div class="stat-lbl">Total</div></div>
    <div class="stat-item"><div class="stat-num" style="color:var(--text3)">${c.Pending}</div><div class="stat-lbl">Pending</div></div>
    <div class="stat-item"><div class="stat-num" style="color:var(--blue)">${c['In Progress']}</div><div class="stat-lbl">In Progress</div></div>
    <div class="stat-item"><div class="stat-num" style="color:var(--amber)">${c['Needs Review']}</div><div class="stat-lbl">Needs Review</div></div>
    <div class="stat-item"><div class="stat-num" style="color:var(--green)">${c.Delivered}</div><div class="stat-lbl">Delivered</div></div>`
}

function setAssignFilter(f, btn) {
  assignFilter = f
  document.querySelectorAll('#tab-assignments .filter-tab').forEach(t => t.classList.remove('active'))
  btn.classList.add('active'); renderAssignList()
}

function renderAssignList() {
  const items = assignFilter === 'all' ? assignments : assignments.filter(a => a.status === assignFilter)
  const sc = { Pending: 'gray', 'In Progress': 'blue', 'Needs Review': 'amber', Delivered: 'green' }
  const today = new Date(); today.setHours(0, 0, 0, 0)
  document.getElementById('assign-list').innerHTML = items.length === 0
    ? `<div class="empty-state"><i class="ti ti-circle-check"></i><p>Nothing here</p></div>`
    : items.map(a => {
        const due = a.due_date ? new Date(a.due_date) : null
        const diff = due ? Math.ceil((due - today) / 86400000) : null
        let dueLabel = a.due_date ? `Due ${fmtDate(a.due_date)}` : ''
        let dueClass = ''
        if (diff !== null && a.status !== 'Delivered') {
          if (diff < 0) { dueLabel = 'Overdue'; dueClass = 'overdue' }
          else if (diff <= 2) { dueLabel = diff === 0 ? 'Due today' : `Due in ${diff}d`; dueClass = 'due-soon' }
        }
        return `<div class="assign-item${selectedAssignId === a.assignment_id ? ' selected' : ''}" onclick="selectAssignment(${a.assignment_id})">
          <div class="assign-item-top">
            <div style="display:flex;gap:7px;flex:1;min-width:0">
              <div class="priority-dot ${a.priority}" style="margin-top:5px"></div>
              <div class="assign-item-title">${escapeHtml(a.title)}</div>
            </div>
            <span class="pill ${sc[a.status] || 'gray'}">${escapeHtml(a.status)}</span>
          </div>
          <div class="assign-item-meta" style="margin-left:14px">
            <span>${escapeHtml(a.type || '—')}</span>${dueLabel ? `<span>·</span><span class="${dueClass}">${dueLabel}</span>` : ''}
          </div>
        </div>`
      }).join('')
}

const WRITER_ALLOWED_TRANSITIONS = {
  'Pending': ['In Progress'],
  'In Progress': ['Needs Review'],
  'Needs Review': ['In Progress']
}

function selectAssignment(id) {
  selectedAssignId = id; renderAssignList()
  const a = assignments.find(x => x.assignment_id === id); if (!a) return
  const sc = { Pending: 'gray', 'In Progress': 'blue', 'Needs Review': 'amber', Delivered: 'green' }
  const sourceFiles = (a.files || []).filter(f => f.kind === 'source')
  const deliverables = (a.files || []).filter(f => f.kind === 'deliverable')
  document.getElementById('assign-detail').innerHTML = `
    <div style="margin-bottom:14px">
      <div style="font-size:16px;font-weight:600;margin-bottom:6px;line-height:1.4">${escapeHtml(a.title)}</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        <span class="pill ${sc[a.status]}">${escapeHtml(a.status)}</span>
        <span class="pill gray">${escapeHtml(a.type || '—')}</span>
        <span class="pill ${a.priority === 'Urgent' ? 'red' : a.priority === 'High' ? 'amber' : 'gray'}">${escapeHtml(a.priority)}</span>
      </div>
    </div>
    <div class="detail-block">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px"><span style="color:var(--text3)">Track</span><span style="font-family:monospace;font-size:11px">${escapeHtml(a.track || '—')}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:12px"><span style="color:var(--text3)">Due</span><span style="font-weight:500">${a.due_date ? fmtDateFull(a.due_date) : '—'}</span></div>
      ${a.notes ? `<div style="margin-top:9px;padding-top:9px;border-top:0.5px solid var(--border);font-size:12px;color:var(--amber-text)">${escapeHtml(a.notes)}</div>` : ''}
    </div>
    <div class="detail-block">
      <div class="section-lbl">Brief</div>
      <div style="font-size:13px;color:var(--text);line-height:1.65">${escapeHtml(a.brief_text || '')}</div>
    </div>
    <div class="detail-block">
      <div class="section-lbl">Source files</div>
      ${sourceFiles.length ? sourceFiles.map(f => `<div class="file-row"><i class="ti ti-file-music"></i><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(f.filename)}</span></div>`).join('') : '<p style="font-size:12px;color:var(--text3)">None attached</p>'}
    </div>
    <div class="detail-block">
      <div class="section-lbl">Deliverables</div>
      ${deliverables.length ? deliverables.map(f => `<div class="deliv-row"><i class="ti ti-circle-check"></i><span style="flex:1">${escapeHtml(f.filename)}</span></div>`).join('') : '<p style="font-size:12px;color:var(--text3)">None yet</p>'}
      <p style="font-size:11px;color:var(--text3);margin-top:8px"><i class="ti ti-info-circle"></i> File delivery isn't wired up yet — send finished files to HAUS the way you do today, then move this to "Needs Review" below.</p>
    </div>`
  const nextActions = {
    'Pending': `<button class="btn primary" onclick="setAssignStatus(${id},'In Progress')"><i class="ti ti-play"></i> Start working</button>`,
    'In Progress': `<button class="btn primary" onclick="setAssignStatus(${id},'Needs Review')"><i class="ti ti-send"></i> Submit for review</button>`,
    'Needs Review': `<button class="btn" onclick="setAssignStatus(${id},'In Progress')"><i class="ti ti-arrow-back"></i> Pull back to In Progress</button>`,
    'Delivered': `<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--green-text)"><i class="ti ti-circle-check"></i> Complete</div>`
  }
  const ab = document.getElementById('assign-action-bar')
  ab.style.display = 'flex'
  ab.innerHTML = `<div style="flex:1;font-size:11px;color:var(--text3)">#${a.assignment_id}</div>${nextActions[a.status] || ''}`
}

async function setAssignStatus(id, status) {
  const data = await _post(`/api/writer-portal/assignments/${id}/status`, { status })
  if (!data.ok) { alert(data.error || 'Could not update status.'); return }
  await loadAssignments()
  selectAssignment(id)
}

// ── My Titles (real data from /api/writer-portal/my-titles) ─────────────
async function loadTitles() {
  const data = await _get('/api/writer-portal/my-titles')
  if (!data.ok) { document.getElementById('titles-list').innerHTML = `<div class="empty-state"><i class="ti ti-alert-circle"></i><p>${escapeHtml(data.error || 'Could not load titles')}</p></div>`; return }
  titles = data.titles
  renderTitles()
}

function renderTitles() {
  const el = document.getElementById('titles-list')
  if (!titles.length) { el.innerHTML = `<div class="empty-state"><i class="ti ti-music-off"></i><p>No titles on file yet</p></div>`; return }
  el.innerHTML = `<table style="width:100%;border-collapse:collapse">
    <thead><tr style="text-align:left;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.03em">
      <th style="padding:8px 10px;border-bottom:0.5px solid var(--border)">Title</th>
      <th style="padding:8px 10px;border-bottom:0.5px solid var(--border)">SKU</th>
      <th style="padding:8px 10px;border-bottom:0.5px solid var(--border)">Genre</th>
      <th style="padding:8px 10px;border-bottom:0.5px solid var(--border)">Status</th>
      <th style="padding:8px 10px;border-bottom:0.5px solid var(--border)">Stems</th>
      <th style="padding:8px 10px;border-bottom:0.5px solid var(--border)">Added</th>
    </tr></thead>
    <tbody>${titles.map(t => `
      <tr>
        <td style="padding:9px 10px;font-size:13px;border-bottom:0.5px solid var(--border)">${escapeHtml(t.title)}</td>
        <td style="padding:9px 10px;font-size:12px;font-family:monospace;border-bottom:0.5px solid var(--border)">${escapeHtml(t.sku_root)}</td>
        <td style="padding:9px 10px;font-size:13px;border-bottom:0.5px solid var(--border)">${escapeHtml(t.genre || '—')}</td>
        <td style="padding:9px 10px;font-size:13px;border-bottom:0.5px solid var(--border)">${escapeHtml(t.status || '—')}</td>
        <td style="padding:9px 10px;font-size:13px;border-bottom:0.5px solid var(--border)">${t.has_stems ? '<i class="ti ti-circle-check" style="color:var(--green)"></i>' : '<i class="ti ti-minus" style="color:var(--text3)"></i>'}</td>
        <td style="padding:9px 10px;font-size:12px;color:var(--text3);border-bottom:0.5px solid var(--border)">${t.date_added ? fmtDate(t.date_added) : '—'}</td>
      </tr>`).join('')}</tbody>
  </table>`
}

// ── Notifications ─────────────────────────────────────────────
async function loadNotifications() {
  const data = await _get('/api/writer-portal/notifications')
  if (!data.ok) return
  notifications = data.notifications
  const badge = document.getElementById('notif-badge')
  if (data.unread_count > 0) { badge.textContent = data.unread_count; badge.style.display = 'inline-block' }
  else { badge.style.display = 'none' }
}

function toggleNotifications() {
  const dd = document.getElementById('notif-dropdown')
  if (dd.style.display === 'block') { dd.style.display = 'none'; return }
  dd.innerHTML = notifications.length === 0
    ? `<div class="empty-state" style="padding:24px"><i class="ti ti-bell-off"></i><p>No notifications</p></div>`
    : notifications.map(n => `
      <div style="padding:10px 14px;border-bottom:0.5px solid var(--border);cursor:pointer;${n.read_at ? '' : 'background:var(--blue-bg)'}" onclick="markNotificationRead(${n.notification_id})">
        <div style="font-size:12px;color:var(--text)">${escapeHtml(n.message)}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:3px">${fmtDateFull(n.created_at)}</div>
      </div>`).join('')
  dd.style.display = 'block'
}

async function markNotificationRead(id) {
  await _post(`/api/writer-portal/notifications/${id}/read`)
  await loadNotifications()
  toggleNotifications(); toggleNotifications()
}

document.addEventListener('click', (e) => {
  const dd = document.getElementById('notif-dropdown')
  if (dd && dd.style.display === 'block' && !e.target.closest('#notif-dropdown') && !e.target.closest('button[onclick="toggleNotifications()"]')) {
    dd.style.display = 'none'
  }
})

// ── Utilities ─────────────────────────────────────────────────
function fmtDate(s) { if (!s) return '—'; const d = new Date(s); return `${MONTHS[d.getMonth()].slice(0, 3)} ${d.getDate()}` }
function fmtDateFull(s) { if (!s) return '—'; const d = new Date(s); return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}` }
function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }

checkSession()
</script>
</body>
</html>
